# Build the game (game/ Vite project) and deploy it to GitHub Pages on every push to main.
# The playable site lands at https://jssao.github.io/crash-test/ (plus /crash-lab.html and
# /model-viewer.html secondary pages). vite.config.ts already uses base './', and the wasm
# binary is checked in at build/wasm/, so a plain npm ci + build is the whole pipeline.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
        working-directory: game
      - run: npm run build
        working-directory: game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
