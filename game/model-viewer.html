<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Viewer — box3d crash sandbox</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d10; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }

      /* Model-picker sidebar + info overlay are built in src/model-viewer/ui.ts (DOM), same
         plain-HTML-paints-instantly philosophy as index.html/crash-lab.html's loading screen. */
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      #hud-loading {
        position: fixed; inset: 0; z-index: 20; background: #0b0d10;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.4s ease;
      }
      #hud-loading.hud-loading-hidden { opacity: 0; pointer-events: none; }
      .hud-loading-inner { width: min(360px, 80vw); text-align: center; color: #cfe8ff; }
      .hud-loading-title { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 18px; }
      .hud-loading-bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
      .hud-loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#4fa8ff,#8fd3ff); transition: width 0.2s ease; }
      .hud-loading-status { margin-top: 10px; font-size: 12px; color: #8fa6bd; letter-spacing: 0.02em; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="hud-loading">
      <div class="hud-loading-inner">
        <div class="hud-loading-title">Model Viewer</div>
        <div class="hud-loading-bar"><div id="hud-loading-fill" class="hud-loading-fill"></div></div>
        <div id="hud-loading-status" class="hud-loading-status">loading…</div>
      </div>
    </div>
    <script type="module" src="/src/model-viewer/main.ts"></script>
  </body>
</html>
